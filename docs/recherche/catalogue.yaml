# Catalogue des projets open source étudiés — NOEZIA ShadowLab
#
# Source : API GitHub (CLI gh), registres PyPI et npm, README des dépôts. Relevé du 2026-11-03.
# Les champs objectifs (licence, dates, étoiles, archivage, version) viennent de l'API GitHub.
# Les champs `documente` sont ce que le projet ANNONCE : ce sont des promesses, pas des preuves.
# Les `limites_connues` sont rapportées par le projet ou ses issues, non reproduites par le laboratoire.
# Aucun résultat de test n'est consigné ici : les mesures viennent des campagnes ShadowLab.
# `non_documente` / `null` = information non trouvée lors du relevé, pas une absence prouvée.
# Périmètre : ce catalogue sert à comparer des moteurs face aux protections du laboratoire, sur le site
# de test local. Il ne vaut pas recommandation d'usage contre un site tiers.
# Rappel : la recherche d'issues "Apple Silicon" par l'API de recherche GitHub a été limitée par le quota ;
# `apple_silicon` repose surtout sur les README et sur les issues les plus commentées.
