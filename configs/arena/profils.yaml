# Niveaux de difficulté progressive de l'Anti-Bot Arena.
# `shadowlab arena appliquer` régénère Nginx et Coraza à partir de ce fichier.
#
# limitation   : requêtes de pages par seconde et par session (Nginx, statiques exclus)
# waf          : Coraza + OWASP CRS. `detection` journalise ; `blocage` bloque au seuil
# defi_js      : preuve de travail SHA-256. `lier_tls` lie le cookie au JA4 du client sans `pre_shared_key` (stable à la reprise de session TLS)
# captcha      : demo CAPTCHA servi quand une règle classe la session comme automatisée
# fingerprinting : examen actif des signaux navigateur (FingerprintJS, BotD, comportement)
#   detecteurs : liste explicite des détecteurs consultés pour ce niveau (vide = legacy 6)
# honeypots    : champs invisibles et liens piège détectant les crawlers aveugles
# turnstile    : Cloudflare Turnstile en mode test (test keys, ne prouve rien contre le vrai)
# recaptcha    : Google reCAPTCHA v2 en mode test (test keys, ne prouve rien contre le vrai)
# connexion    : niveau authentifié — login protégé par détection comportementale (comptes de test locaux)

"01":
  nom: Baseline
  description: Site nu, aucune protection
  limitation: {debit: 1000, rafale: 1000}
  waf: {mode: detection, paranoia: 1, seuil: 100}
  defi_js: {actif: false, difficulte: 0, lier_tls: false}
  captcha: {actif: false}
  fingerprinting: {actif: false}
  honeypots: {actif: false}
  turnstile: {actif: false}
  recaptcha: {actif: false}
  connexion: {actif: false, tentatives_max: 5}

"02":
  nom: "D\xE9tection simple"
  description: "Blocage sur signaux HTTP et TLS, limites de fréquence"
  limitation: {debit: 20, rafale: 40}
  waf: {mode: detection, paranoia: 1, seuil: 10}
  defi_js: {actif: false, difficulte: 0, lier_tls: false}
  captcha: {actif: false}
  fingerprinting:
    actif: true
    bloquer: http
    detecteurs: [regles-http, tls]
  honeypots: {actif: false}
  turnstile: {actif: false}
  recaptcha: {actif: false}
  connexion: {actif: false, tentatives_max: 5}

