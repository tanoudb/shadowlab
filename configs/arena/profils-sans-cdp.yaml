# Niveaux 04 à 07 à l'identique, sans le détecteur cdp (ablation, docs/PLAN.md étape 1.7).
# Généré à partir de configs/arena/profils.yaml : seule la ligne `exclure: [cdp]` diffère.
# À régénérer si les niveaux 04 à 07 changent. Usage : voir configs/experiments/ablation-cdp.yaml.
04scdp:
  nom: Challenges sans cdp
  description: Niveau 04 à l'identique, détecteur cdp écarté (exclure)
  limitation:
    debit: 5
    rafale: 15
  waf:
    mode: blocage
    paranoia: 1
    seuil: 5
  defi_js:
    actif: true
    difficulte: 12
    lier_tls: false
  captcha:
    actif: true
  fingerprinting:
    actif: true
    bloquer: tout
    exclure:
    - cdp
    detecteurs:
    - regles-http
    - tls
    - botd
    - regles-js
    - coherence
    - comportement
    - prototypes
    - coherence-profonde
    - headless
    - chrome-apis
    - langues
    - media-codecs
    - integrite-proprietes
    - stack-trace
    - stack-getter
    - automation-globals
    - css-media
    - prototype-chain
    - enumerable-props
    - proxy-uadata
    - audio-context
    - polices
    - math-constants
    - domrect
    - deep-proxy
    - cdp
    seuil_composite: 0.8
  honeypots:
    actif: false
  turnstile:
    actif: false
  recaptcha:
    actif: false
  connexion:
    actif: false
    tentatives_max: 5
