# Validation élargie des détecteurs renforcés v2
# 4 scénarios × 4 niveaux × 3 répétitions = 48 passages
# Inclut connexion (login anti-bot) pour tester le blocage différé
experiment:
  name: validation_detecteurs_v2_elargie
  description: >-
    Validation statistique des détecteurs renforcés. Inclut le scénario
    connexion (login anti-bot niveaux 05-06) et 3 répétitions par combinaison
    pour mesurer la fiabilité. Objectif : 100% de détection sur passages valides.
  environment: local
  engines:
    - noezia
  scenarios:
    - static_html
    - javascript_content
    - detection_page
    - connexion
  protections:
    - "03"
    - "04"
    - "05"
    - "06"
  repetitions: 3
  seed: 20261111
  warmup: 0
  metrics:
    - detection_rate
    - execution_time
    - scenario_success
  output: [json, html]
