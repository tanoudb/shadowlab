# Un long parcours qui dure plus longtemps que le cookie de défi de l'Arena : le site de rallye, 427 pages.
# La campagne 107 a lu ces 427 pages en une seule session aux niveaux 04, 05 et 06 sans corrélation, en 50 minutes,
# juste sous l'heure que vit le cookie de défi. Ici le cookie vit 600 s (profils « cookie court », D-82) : le défi
# revient quatre à cinq fois par passage. La question : la récolte repasse-t-elle la porte toute seule à chaque fois
# (option de la recette activée par le scénario), et rapporte-t-elle encore toutes les pages et tous les champs ?
# Faire d'abord l'essai court : `recolte-arena-cookie-court-essai.yaml`.
#   noezia-natif : moteur `navigateur` de la récolte (vrai Chrome avec interface, identité d'origine)
# Un passage réussi = récolte terminée, pages, enregistrements et champs à 99 % ou plus. Le nombre de passages
# de la porte en cours de route est dans les détails du passage.
# Niveau 06 sans le détecteur correlation-session (`06scorrcourt`), comme les campagnes 97 à 111.
# Aux niveaux 05 et 06, un CAPTCHA en clés de test est servi : passages étiquetés `captcha_test`.
# Une seule répétition par niveau : c'est une première mesure, pas une preuve statistique.
#
#   1. SHADOWLAB_PROFILS_EXTRA=configs/arena/profils-cookie-court.yaml uv run shadowlab arena appliquer
#   2. SHADOWLAB_PROFILS_EXTRA=configs/arena/profils-cookie-court.yaml SHADOWLAB_RALLYE_TAILLE=24 \
#        uv run shadowlab campagne configs/experiments/recolte-arena-cookie-court.yaml
#   3. uv run shadowlab arena appliquer
#
# Des fenêtres de navigateur s'ouvrent à l'écran. Le site du labo (port 8770) est pris pendant la campagne.
# 1 moteur × 3 niveaux × 1 scénario × 1 répétition = 3 passages (environ 2 h 45, estimation).
experiment:
  name: recolte_arena_cookie_court
  description: >-
    La récolte générale du site de rallye (427 pages dans une seule session) aux niveaux 04, 05 et 06 de l'Arena
    (06 sans corrélation) avec un cookie de défi de 600 s : le défi revient plusieurs fois en cours de passe.
  environment: local
  engines:
    - name: noezia
      label: noezia-natif
      options: {headless: false, channel: chrome, identite_native: true}
  protections: ["04court", "05court", "06scorrcourt"]
  scenarios:
    - recolte_recette_rallye
  repetitions: 1
  seed: 20261114
  output: [json, html]
