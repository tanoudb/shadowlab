# Discrétion au niveau 06 complet (corrélation 2.0), mesure du 18/11 : le fichier de la campagne 119
# (`correlation-06-mondes.yaml`) à 14 répétitions, soit 42 passages, un monde par passage (chaque passage est une première
# visite). `shadowlab arena appliquer` sans profils supplémentaires avant.
experiment:
  name: correlation_06_monde_passage_42
  description: >-
    noezia en identité native au niveau 06 complet (avec corrélation 2.0), un monde par passage, 42 passages.
  environment: local
  engines:
    - name: noezia
      label: noezia-natif
      options: {headless: false, channel: chrome, identite_native: true}
  protections: ["06"]
  scenarios:
    - static_html
    - javascript_content
    - pagination
  repetitions: 14
  seed: 20261118
  monde: passage
  output: [json, html]
