# Validation des détecteurs renforcés v2
# Vérifie que DetecteurComportement v2, DetecteurCDP et MetaComposite
# détectent NOEZIA aux niveaux protégés.
experiment:
  name: validation_detecteurs_v2
  description: >-
    Campagne de validation après renforcement des détecteurs :
    - DetecteurComportement v2 (signaux de naturalité)
    - DetecteurCDP (artefacts Chrome DevTools Protocol)
    - DetecteurMetaComposite (session trop propre)
    NOEZIA doit être détecté au minimum aux niveaux 04+.
  environment: local
  engines:
    - noezia
  scenarios:
    - static_html
    - javascript_content
    - detection_page
  protections:
    - "03"
    - "04"
    - "05"
    - "06"
  repetitions: 2
  seed: 20261110
  warmup: 0
  metrics:
    - detection_rate
    - execution_time
    - scenario_success
  output: [json, html]
