# Témoins de la mesure de discrétion du 18/11 (`discretion-native-42.yaml`) : les deux outils sans réglage, 15 passages
# par niveau. La mesure ne vaut que si ces témoins sont arrêtés aux niveaux protégés. Même encadrement par
# `shadowlab arena appliquer` (profils sans corrélation).
experiment:
  name: discretion_temoins_15
  description: >-
    Témoins de la mesure de discrétion : patchright et playwright sans réglage, 15 passages par niveau de 01 à 06
    (06 sans corrélation entre sessions).
  environment: local
  engines:
    - name: patchright
    - name: playwright
  protections: ["01", "02", "03", "04", "05", "06scorr"]
  scenarios:
    - static_html
    - javascript_content
    - pagination
  repetitions: 5
  seed: 20261118
  output: [json, html]
