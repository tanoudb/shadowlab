# Palier 2, I10 (D-104) : essai « l'espace privé refusé à une identité DÉJÀ connectée », devant la vraie Arena.
#
# Un seul bras (`temoin-compte`, compte `analyste`, profil `endurance`) : visites 1 et 2 par la même identité (connexion
# à la 1re, espace sans se reconnecter à la 2e) ; avant la 3e, son COMPTE est banni à la main (`bannir_avant_visite`,
# le code de `shadowlab arena bannir --compte`) ; la 3e visite est faite par LA MÊME identité, encore connectée : la
# vitrine passe (le visiteur n'est pas banni), l'espace privé doit être refusé (403, `X-Arena-Refus: bannissement`),
# l'identité notée `banni`, rien demandé après ; la 4e visite n'est pas lancée.
# `comptes-essai.yaml` montre le refus à la connexion depuis une AUTRE identité ; celui-ci montre le refus sur l'espace
# d'une session déjà ouverte, vu jusque-là par les tests seulement.
#
# Préalables : Arena lancée, `uv run shadowlab arena appliquer` SANS SHADOWLAB_PROFILS_EXTRA.
# Commande : uv run shadowlab campagne configs/experiments/comptes-espace-essai.yaml   (environ 8 minutes)
# L'identité finit bannie : changer le suffixe `-1` pour recommencer.
experiment:
  name: comptes_espace_essai
  description: >-
    Essai des comptes (I10) : un compte banni à la main est refusé sur l'espace privé à l'identité déjà connectée.
  environment: local
  engines:
    - name: noezia
      label: temoin-compte
      visites: 4
      compte: analyste
      bannir_avant_visite: 3
      options: {headless: false, channel: chrome, identite_native: true, identite: comptes-espace-1}
  protections: [endurance]
  scenarios: [visite]
  repetitions: 4
  pages_par_visite: 6
  espacement: {mode: fixe, minutes: 2}
  concurrency: 1
  monde: serie
  seed: 20261119
  output: [json, html]
