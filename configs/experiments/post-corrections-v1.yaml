# Campagne post-corrections : mesurer l'impact des 3 corrections (F1, F2, F8).
# F1 : comportement connecté au gardien (REGLES_JAVASCRIPT).
# F2 : canvas_erreur détecté par regles-js v2.
# F8 : détection CDP/automation (cdc, playwright, selenium globals).
#
# 7 moteurs × 6 protections × 10 scénarios × 10 répétitions = 4 200 passages.
# Comparable aux campagnes #15/#16 (mêmes moteurs, mêmes niveaux, scénarios complets).
experiment:
  name: post_corrections_v1
  description: >-
    Impact des corrections F1/F2/F8 : détecteur comportemental connecté,
    détection CDP/automation, canvas en erreur. Tous les scénarios y compris
    burst_crawl et synthetic_browse (absents des campagnes précédentes).
    Turnstile et reCAPTCHA en test keys (résultats étiquetés captcha_test).
  environment: local
  engines:
    # Anti-détection (intéressants : passaient tout avant corrections)
    - camoufox
    - scrapling-furtif
    - patchright
    # Standard (référence : déjà bloqués)
    - playwright
    - selenium
    # HTTP (pas de JS, référence basse)
    - httpx
    - curl-cffi
  protections:
    - "01"
    - "02"
    - "03"
    - "04"
    - "05"
    - "06"
  scenarios:
    - static_html
    - javascript_content
    - pagination
    - form_interaction
    - session_cookies
    - fingerprint_observation
    - detection_page
    - api_json
    - burst_crawl
    - synthetic_browse
  repetitions: 10
  seed: 20261105
  concurrency: 1
  output: [json, csv, html]
