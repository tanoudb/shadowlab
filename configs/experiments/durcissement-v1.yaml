# Validation durcissement Arena : détecteur CDP + seuils composites abaissés
# NOEZIA × niveaux 04-06 × scénarios clés × 2 reps
experiment:
  name: durcissement_v1
  description: >-
    Valide le nouveau détecteur CDP et les seuils composites abaissés.
    Objectif : NOEZIA doit commencer à être détecté aux niveaux 04+.
  environment: local
  engines:
    - noezia
  scenarios:
    - detection_page
    - javascript_content
  protections:
