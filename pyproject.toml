[project]
name = "noezia-shadowlab"
version = "0.1.0"
description = "Laboratoire local de comparaison des moteurs de navigation automatisée face à des détecteurs anti-bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "pydantic>=2.14",
    "pyyaml>=6.0.3",
    "psutil>=7.2",
    "playwright>=1.64",
    "selenium>=4.52",
    "scrapling[fetchers]>=0.5",
    "curl-cffi>=0.17",
    "httpx>=0.28",
    "lxml>=6.1",
    "cssselect>=1.5",
    "cryptography>=46",
    "pillow>=11",
    "h11>=0.16",
    "tenacity>=9",
    "parsel>=1.12",
    "selectolax>=1",
    "scipy>=1.14",
]

[project.scripts]
shadowlab = "shadowlab.cli:main"

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadowlab"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests réels avec navigateurs et site local (plus lents)"]

[tool.ruff.lint.per-file-ignores]
# gabarits HTML : les lignes suivent le balisage, pas la largeur du code
"src/shadowlab/reports.py" = ["E501"]
"src/shadowlab/site/pages.py" = ["E501"]
